<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Frontier Gold</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Frontier Gold Trading Post</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="shop.html">Trading Post</a>
            <a href="cart.html">Cart</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Account</a>
        </nav>
    </header>

    <main class="login-page">
        <p class="small-title">TRAVELER ACCOUNT</p>
        <h2>Enter your account</h2>
        <p>Sign in to keep your purchase records in one place.</p>

        <section class="account-panel">
            <form id="login-form" class="login-form">
                <label>
                    Username
                    <input type="text" name="username" minlength="3" autocomplete="username" required>
                </label>

                <label>
                    Password
                    <input type="password" name="password" minlength="4" autocomplete="current-password" required>
                </label>

                <button type="submit">Sign in</button>
                <p id="login-message" class="form-message" aria-live="polite"></p>
            </form>

            <div id="account-history" class="account-history" hidden>
                <div class="account-heading">
                    <h3>Purchase records</h3>
                    <button id="logout-button" class="logout-button" type="button">Sign out</button>
                </div>
                <div id="purchase-list"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>Unofficial fan-made learning project. Not affiliated with Rockstar Games.</p>
    </footer>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="../js/app.js"></script>
</body>
</html>
